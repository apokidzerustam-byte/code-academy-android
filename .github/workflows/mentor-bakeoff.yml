name: Сравнение моделей наставника

# Ручной запуск: gh workflow run mentor-bakeoff.yml
# Для каждой модели — одни и те же задания и вопросы, ответы и скорость в журнале и в отчёте (артефакт mentor-bakeoff-*).
on:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  bakeoff:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coder-0.5b
            suffix: "-"
            urls: "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
          - name: coder-1.5b
            suffix: "-"
            urls: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          - name: qwen2.5-1.5b
            suffix: "-"
            urls: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          - name: qwen3-1.7b
            suffix: nothink
            urls: "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf"
          - name: qwen3-4b-2507
            suffix: "-"
            urls: "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          - name: qwen3.5-0.8b
            suffix: nothink
            urls: "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf"
          - name: qwen3.5-2b
            suffix: nothink
            urls: "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf"
          - name: qwen3.5-4b
            suffix: nothink
            urls: "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - run: sudo apt-get install -y ninja-build > /dev/null
      - name: NDK и CMake для llama.cpp
        run: |
          bash tools/install-ndk.sh
          bash tools/fetch-llama.sh
      - name: Сборка редактора CodeMirror
        working-directory: editor-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка раннера Pyodide
        working-directory: pyodide-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка веб-раннера
        working-directory: web-runner
        run: npm install --no-audit --no-fund && npm run build
      - name: Модель и сравнение
        env:
          BAKE_NAME: ${{ matrix.name }}
          BAKE_URLS: ${{ matrix.urls }}
          BAKE_SUFFIX: ${{ matrix.suffix }}
        run: bash ci/mentor-bakeoff.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mentor-bakeoff-${{ matrix.name }}
          path: |
            app/build/reports/mentor-*.md
            app/build/reports/mentor-cli*.log
