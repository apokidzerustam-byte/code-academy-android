name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Коммит озвучки делается токеном Actions и сам сборку не запускает — запускаем после «Narrate lessons».
  workflow_run:
    workflows: ["Narrate lessons"]
    types: [completed]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.14.3"
  KOTLIN_VERSION: "2.1.20"

permissions:
  contents: write

jobs:
  harness:
    name: Песочница и контент (pytest + валидатор)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Те же версии FastAPI/pydantic, что ставит Chaquopy в приложение (app/build.gradle.kts).
      - run: pip install pytest jsonschema "fastapi==0.125.0" "pydantic==1.10.27" "httpx==0.28.1"
      - name: Компилятор Kotlin (проверка эталонов и вывода сцен)
        run: |
          curl -sSLo /tmp/kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /opt
          echo "KOTLINC=/opt/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
      - name: Веб-раннер — тесты и сборка (HTML/CSS/JS, SQL, Kotlin)
        working-directory: web-runner
        run: npm install --no-audit --no-fund && npm test && npm run build
      - run: python -m pytest harness-tests -v
        env: { CA_REQUIRE_FASTAPI: "1" }
      - name: Проверка контент-пакетов
        run: python tools/validate_content.py content/packs --json content-report.json --require-kotlinc
      - name: Отчёт о контенте
        if: always()
        run: |
          echo "### Контент" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat content-report.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Сборка редактора CodeMirror
        working-directory: editor-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка раннера Pyodide
        working-directory: pyodide-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка веб-раннера (HTML/CSS/JS, SQL, Kotlin)
        working-directory: web-runner
        run: npm install --no-audit --no-fund && npm run build
      - name: NDK и CMake для llama.cpp (как в примере llama.android)
        run: |
          bash tools/install-ndk.sh
          bash tools/fetch-llama.sh
      - name: Модульные тесты (JVM)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Шаблон проекта Kotlin — сценарий GitHub Actions по-настоящему
        working-directory: app/build/kotlin-template
        run: |
          # Выполняем шаги run: из .github/workflows/kotlin.yml шаблона, как их выполнит GitHub у ученика.
          python3 - <<'PY' > steps.sh
          import re
          wf = open(".github/workflows/kotlin.yml", encoding="utf-8").read()
          for block in re.findall(r"run: \|\n((?:          .*\n)+)|run: (.+)\n", wf):
              print(block[0].replace("          ", "", 1).replace("\n          ", "\n") if block[0] else block[1])
          PY
          cat steps.sh
          bash -e steps.sh | tee run.log
          grep -q "Привет, Мир!" run.log
      - name: Сборка APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: В APK нет разрешения INTERNET и есть наставник (llama.cpp)
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then echo "В APK есть INTERNET"; exit 1; fi
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/lib(mentor|llama|ggml)" | tee /tmp/libs.txt
          grep -q "lib/arm64-v8a/libmentor.so" /tmp/libs.txt && grep -q "lib/arm64-v8a/libggml-cpu" /tmp/libs.txt
          echo "### Наставник в APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/libs.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Размер APK
        run: |
          echo "### Размер APK" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} \; | awk '{printf "- %s: %.1f МБ\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: code-academy-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Опубликовать APK в ветку apk (для установки на телефон)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_run')
        run: |
          mkdir -p /tmp/apk && cp app/build/outputs/apk/release/app-release.apk /tmp/apk/code-academy-proto.apk
          cd /tmp/apk
          sha256sum code-academy-proto.apk > SHA256SUMS.txt
          echo "commit ${GITHUB_SHA}" >> SHA256SUMS.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

  mentor-model:
    name: Наставник с моделью (llama.cpp + Qwen2.5-Coder, 20 провокаций)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - run: sudo apt-get install -y ninja-build > /dev/null
      - name: NDK и CMake для llama.cpp (как в примере llama.android)
        run: |
          bash tools/install-ndk.sh
          bash tools/fetch-llama.sh
      - name: Сборка редактора CodeMirror
        working-directory: editor-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка раннера Pyodide
        working-directory: pyodide-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка веб-раннера
        working-directory: web-runner
        run: npm install --no-audit --no-fund && npm run build
      - uses: actions/cache@v4
        with:
          path: ~/models
          key: qwen2.5-coder-gguf-v1
      - name: Модель, контрольные суммы, 20 провокаций
        run: bash ci/mentor-model-test.sh
      - name: Отчёт
        if: always()
        run: |
          cat app/build/reports/mentor-hashes.md >> "$GITHUB_STEP_SUMMARY" || true
          cat app/build/reports/mentor-model.md >> "$GITHUB_STEP_SUMMARY" || true
          tail -n 30 app/build/reports/mentor-cli.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mentor-model-report
          path: |
            app/build/reports/mentor-*.md
            app/build/reports/mentor-cli.log
            app/build/reports/tests/

  emulator:
    name: Тесты на эмуляторе (API ${{ matrix.api }}, ${{ matrix.ram }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Эмулятор x86_64: llama.cpp собирается только под него.
      ORG_GRADLE_PROJECT_caAbi: x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, ram: "3072M" }   # «слабый» профиль из ТЗ
          - { api: 29, ram: "4096M" }   # старый Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Сборка редактора CodeMirror
        working-directory: editor-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка раннера Pyodide
        working-directory: pyodide-web
        run: npm install --no-audit --no-fund && npm run build
      - name: Сборка веб-раннера (HTML/CSS/JS, SQL, Kotlin)
        working-directory: web-runner
        run: npm install --no-audit --no-fund && npm run build
      - name: NDK и CMake для llama.cpp (как в примере llama.android)
        run: |
          bash tools/install-ndk.sh
          bash tools/fetch-llama.sh
      - name: Модель наставника для теста на устройстве (API 34)
        if: matrix.api == 34
        uses: actions/cache@v4
        with:
          path: ~/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          key: qwen2.5-coder-0.5b-q4km-v1
      - name: Загрузка модели (если нет в кэше)
        if: matrix.api == 34
        run: |
          mkdir -p ~/models; f=~/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          [ -s "$f" ] || curl -fL --retry 3 -o "$f" https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
          ls -l "$f"; echo "CA_MENTOR_MODEL=$f" >> "$GITHUB_ENV"
      - name: Предсборка тестового APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Инструментальные тесты
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/emulator-tests.sh :app:connectedDebugAndroidTest
      - name: Замеры в отчёт
        if: always()
        run: |
          echo "### Замеры (API ${{ matrix.api }}, RAM ${{ matrix.ram }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/probe.log >> "$GITHUB_STEP_SUMMARY" || echo "нет probe.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-api${{ matrix.api }}
          path: |
            build/ci/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
