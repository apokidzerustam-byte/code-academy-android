name: Voice samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content-pipeline/voices/**", ".github/workflows/voices.yml"]

jobs:
  samples:
    name: Образцы голосов Piper (CC0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install piper-tts
      - run: python content-pipeline/voices/make_samples.py voice-samples
      - run: |
          echo "### Образцы голосов" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat voice-samples/report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice-samples/
