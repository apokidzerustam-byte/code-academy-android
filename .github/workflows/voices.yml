name: Voice samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content-pipeline/voices/make_samples.py", ".github/workflows/voices.yml"]

permissions:
  contents: write

jobs:
  samples:
    name: Образцы голосов Piper (CC0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install piper-tts
      - run: python content-pipeline/voices/make_samples.py voice-samples
      - name: Опубликовать образцы в ветку voice-samples
        run: |
          cat voice-samples/report.json
          git fetch origin voice-samples --depth 1 || true
          git worktree add -B voice-samples /tmp/vs origin/voice-samples 2>/dev/null || git worktree add --orphan -b voice-samples /tmp/vs
          cp voice-samples/* /tmp/vs/
          cd /tmp/vs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Образцы голосов Piper ($(date -u +%F))" && git push origin voice-samples
